name: Deploy to InfinityFree

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-deploy:
    name: Deploy to InfinityFree
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Checkout latest code
        uses: actions/checkout@v4

      - name: 🔍 Check if secrets are configured
        run: |
          if [ -z "${{ secrets.FTP_USERNAME }}" ]; then
            echo "::error::GitHub secret 'FTP_USERNAME' was not found! Please check GitHub Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi
          if [ -z "${{ secrets.FTP_PASSWORD }}" ]; then
            echo "::error::GitHub secret 'FTP_PASSWORD' was not found! Please check GitHub Settings -> Secrets and variables -> Actions -> Repository secrets."
            exit 1
          fi
          echo "FTP credentials are present in GitHub secrets."

      - name: 📂 Sync files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftpupload.net
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./htdocs/
          protocol: ftp
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            README.md
            scratch/**
            php/config.php
